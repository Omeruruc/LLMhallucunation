<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Halüsinasyon Pipeline</title>
    <meta name="description" content="Multi-model LLM hallucination detection and correction pipeline">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="container">
        <!-- Header -->
        <header class="header" id="header">
            <div class="logo">
                <span class="logo-icon">🔬</span>
                <h1 class="title">Halüsinasyon <span class="gradient-text">Pipeline</span></h1>
            </div>
            <p class="subtitle">1. ajan Gemini · Yanındaki 3 ajan kullanıcı seçimiyle multi-model çalışır</p>
        </header>

        <!-- Model Config Section -->
        <section class="section" id="modelsSection">
            <div class="section-header">
                <h2 class="section-title">Ajan ve Model Yapılandırması</h2>
                <span class="section-badge">Gemini + 3 Multi-Model Ajan</span>
            </div>
            <div class="models-grid" id="modelsGrid"></div>
        </section>

        <!-- Question Section -->
        <section class="section" id="questionSection">
            <div class="section-header">
                <h2 class="section-title">Soru Girin</h2>
            </div>
            <div class="question-card">
                <textarea id="questionInput" class="question-input" placeholder="Sorunuzu buraya yazın... Örn: Türkiye'nin en büyük gölü hangisidir?" rows="3"></textarea>
                <div class="question-footer">
                    <div class="param-row">
                        <label class="param-label">Max Tokens
                            <input type="number" id="globalMaxTokens" class="param-input" value="2048" min="128" max="4096" step="64">
                        </label>
                        <label class="param-label">Top P
                            <input type="number" id="globalTopP" class="param-input" value="0.9" min="0.1" max="1.0" step="0.05">
                        </label>
                    </div>
                    <button id="runBtn" class="run-btn" onclick="runPipeline()">
                        <span class="run-btn-icon">▶</span>
                        Pipeline'ı Çalıştır
                    </button>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section class="section results-section" id="resultsSection">
            <div class="section-header">
                <h2 class="section-title">Pipeline Sonuçları</h2>
                <button class="clear-btn" onclick="clearResults()">Temizle</button>
            </div>
            <div class="pipeline-flow" id="pipelineFlow"></div>
        </section>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
